# DeepSeek provider config

[server]
port = 5555

[upstream]
base_url = "https://api.deepseek.com/v1"
api_key = "sk-YOUR_DEEPSEEK_API_KEY"
timeout = 120

[models]
"gpt-5.5" = "deepseek-v4-pro"
"gpt-5.4" = "deepseek-v4-flash"
"gpt-5.4-mini" = "deepseek-v4-flash"

[reasoning]
# OpenAI effort value → DeepSeek effort value
# DeepSeek only supports "high" and "max"
low    = "high"
medium = "high"
high   = "high"
xhigh  = "max"

[traces]
dir = "traces-deepseek"
